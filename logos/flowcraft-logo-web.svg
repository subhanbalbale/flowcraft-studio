<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="100%">
  <defs>
    <linearGradient id="c3w-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e93"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem Badge -->
  <g id="icon" transform="translate(120, 120) scale(0.58)">
    <rect x="-140" y="-140" width="280" height="280" rx="68" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
    
    <!-- Lowercase 'f' Stem -->
    <path d="M 0 -75 
             C -25 -75, -50 -55, -50 -20 
             V 85" 
          fill="none" 
          stroke="#0f172a" 
          stroke-width="28" 
          stroke-linecap="round"/>

    <!-- 'f' Crossbar extending into 'c' Arc -->
    <path d="M -85 -5 
             H 20 
             C 65 -5, 90 15, 90 45 
             C 90 80, 60 98, 20 98 
             C -15 98, -35 80, -35 55" 
          fill="none" 
          stroke="#0f172a" 
          stroke-width="28" 
          stroke-linecap="round"/>

    <!-- Signature Pink Dot -->
    <circle cx="125" cy="85" r="18" fill="url(#c3w-pink)"/>
  </g>

  <!-- Divider Line -->
  <line x1="225" y1="65" x2="225" y2="175" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>

  <!-- Right Wordmark Group -->
  <g id="wordmark" transform="translate(265, 142)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="76" letter-spacing="-2.5" fill="#0f172a">
      flowcraft<tspan fill="url(#c3w-pink)">.</tspan>
    </text>
    <text x="2" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="18" letter-spacing="4" fill="#64748b" text-transform="uppercase">
      Software &amp; Hardware Studio
    </text>
  </g>
</svg>
