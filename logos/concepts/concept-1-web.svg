<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="100%">
  <defs>
    <linearGradient id="c1w-slate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="c1w-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e93"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem Group -->
  <g id="icon" transform="translate(120, 120) scale(0.62)">
    <!-- Primary Flow Loop -->
    <path d="M -80 70 
             C -130 10, -130 -80, -70 -125 
             C -15 -165, 80 -150, 125 -95 
             C 145 -70, 140 -40, 115 -25 
             C 90 -10, 65 -15, 50 -35 
             C 25 -70, -35 -80, -70 -50 
             C -100 -20, -100 35, -60 70 
             Z" 
          fill="url(#c1w-slate)"/>

    <!-- Interlocking Craft Arc -->
    <path d="M 80 -70 
             C 130 -10, 130 80, 70 125 
             C 15 165, -80 150, -125 95 
             C -145 70, -140 40, -115 25 
             C -90 10, -65 15, -50 35 
             C -25 70, 35 80, 70 50 
             C 100 20, 100 -35, 60 -70 
             Z" 
          fill="url(#c1w-pink)"/>

    <!-- Center Node -->
    <circle cx="0" cy="0" r="20" fill="#0f172a"/>
    <circle cx="0" cy="0" r="10" fill="#ffffff"/>

    <!-- Signature Accent Dot -->
    <circle cx="115" cy="-95" r="16" fill="url(#c1w-pink)"/>
  </g>

  <!-- Divider Line -->
  <line x1="225" y1="65" x2="225" y2="175" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>

  <!-- Right Wordmark Group -->
  <g id="wordmark" transform="translate(265, 142)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="76" letter-spacing="-2.5" fill="#0f172a">
      flowcraft<tspan fill="url(#c1w-pink)">.</tspan>
    </text>
    <text x="2" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="18" letter-spacing="4" fill="#64748b" text-transform="uppercase">
      Software &amp; Hardware Studio
    </text>
  </g>
</svg>
