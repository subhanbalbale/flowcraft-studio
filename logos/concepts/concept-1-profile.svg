<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="c1-slate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="c1-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e93"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="c1-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#ec4899" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="120" fill="#faf8f9"/>
  <rect x="2" y="2" width="508" height="508" rx="118" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="4" y="4" width="504" height="504" rx="116" fill="none" stroke="#f1f5f9" stroke-width="2"/>

  <!-- Kinetic Möbius Flow Emblem -->
  <g id="icon" filter="url(#c1-shadow)" transform="translate(256, 256)">
    <!-- Primary Flow Loop ('F' Upper Sweep in Deep Slate) -->
    <path d="M -80 70 
             C -130 10, -130 -80, -70 -125 
             C -15 -165, 80 -150, 125 -95 
             C 145 -70, 140 -40, 115 -25 
             C 90 -10, 65 -15, 50 -35 
             C 25 -70, -35 -80, -70 -50 
             C -100 -20, -100 35, -60 70 
             Z" 
          fill="url(#c1-slate)"/>

    <!-- Interlocking Craft Arc ('C' Lower Wave in Electric Rose) -->
    <path d="M 80 -70 
             C 130 -10, 130 80, 70 125 
             C 15 165, -80 150, -125 95 
             C -145 70, -140 40, -115 25 
             C -90 10, -65 15, -50 35 
             C -25 70, 35 80, 70 50 
             C 100 20, 100 -35, 60 -70 
             Z" 
          fill="url(#c1-pink)"/>

    <!-- Kinetic Center Node (Hardware / Software Touchpoint) -->
    <circle cx="0" cy="0" r="22" fill="#0f172a"/>
    <circle cx="0" cy="0" r="12" fill="#ffffff"/>

    <!-- Signature FlowCraft Accent Dot -->
    <circle cx="115" cy="-95" r="16" fill="url(#c1-pink)"/>
  </g>
</svg>
