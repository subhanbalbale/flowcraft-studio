<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="100%">
  <defs>
    <linearGradient id="c2w-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="c2w-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="c2w-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e93"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem Group -->
  <g id="icon" transform="translate(120, 120) scale(0.62)">
    <!-- Top Isometric Facet -->
    <polygon points="0,-136 119,-68 0,0 -119,-68" fill="url(#c2w-top)" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Left Isometric Facet -->
    <polygon points="-119,-68 0,0 0,136 -119,68" fill="url(#c2w-left)"/>
    
    <!-- Right Isometric Facet -->
    <polygon points="0,0 119,-68 119,68 0,136" fill="url(#c2w-right)"/>

    <!-- Geometric F & C Cuts -->
    <path d="M -81 -28 H -31 M -81 8 H -46" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    <path d="M 79 -16 C 54 -26 39 -11 39 19 C 39 49 54 64 79 54" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

    <!-- NFC Waves -->
    <path d="M -26 -86 C -11 -96 11 -96 26 -86" fill="none" stroke="#ec4899" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M -41 -106 C -16 -121 16 -121 41 -106" fill="none" stroke="#ec4899" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Apex Dot -->
    <circle cx="0" cy="-136" r="14" fill="#ff2e93"/>
    <circle cx="0" cy="-136" r="6" fill="#ffffff"/>
  </g>

  <!-- Divider Line -->
  <line x1="225" y1="65" x2="225" y2="175" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>

  <!-- Right Wordmark Group -->
  <g id="wordmark" transform="translate(265, 142)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="76" letter-spacing="-2.5" fill="#0f172a">
      flowcraft<tspan fill="#ff2e93">.</tspan>
    </text>
    <text x="2" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="18" letter-spacing="4" fill="#64748b" text-transform="uppercase">
      Software &amp; Hardware Studio
    </text>
  </g>
</svg>
