<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="c3-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2e93"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="c3-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ec4899" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="120" fill="#faf8f9"/>
  <rect x="2" y="2" width="508" height="508" rx="118" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="4" y="4" width="504" height="504" rx="116" fill="none" stroke="#f1f5f9" stroke-width="2"/>

  <!-- Swiss Minimalist fc. Monogram (Extreme Legibility at all scales) -->
  <g id="icon" filter="url(#c3-shadow)">
    <!-- Lowercase 'f' Stem and Arch -->
    <path d="M 245 150 
             C 215 150, 185 170, 185 210 
             V 360" 
          fill="none" 
          stroke="#0f172a" 
          stroke-width="34" 
          stroke-linecap="round"/>

    <!-- 'f' Crossbar extending directly into 'c' Arc -->
    <path d="M 140 235 
             H 275 
             C 335 235, 365 260, 365 300 
             C 365 342, 325 365, 275 365 
             C 230 365, 205 340, 205 305" 
          fill="none" 
          stroke="#0f172a" 
          stroke-width="34" 
          stroke-linecap="round"/>

    <!-- The Signature FlowCraft Dot (Solid Electric Pink) -->
    <circle cx="410" cy="350" r="24" fill="url(#c3-pink)"/>
  </g>
</svg>
