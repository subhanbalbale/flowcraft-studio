<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="flowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="flowGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <linearGradient id="craftAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base for Standalone Icon Use -->
  <rect width="512" height="512" rx="112" fill="#090d16" />
  
  <!-- Subtle Architectural Grid Background Lines -->
  <path d="M64 256 H448 M256 64 V448" stroke="rgba(255,255,255,0.04)" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="2" />

  <!-- FlowCraft Kinetic Monogram (Interlocking F & C dynamic ribbon) -->
  <g id="icon" transform="translate(256, 256)">
    <!-- Ambient Energy Core -->
    <circle cx="0" cy="0" r="85" fill="url(#flowGrad1)" opacity="0.18" filter="url(#subtleGlow)" />

    <!-- Top Flow Ribbon (The 'F' sweep) -->
    <path d="M-85 -70 C-40 -125, 60 -125, 105 -70 C125 -45, 115 -15, 85 -15 H-30 C-45 -15, -60 -25, -70 -40 Z" 
          fill="url(#flowGrad1)" />
    
    <!-- Central Kinetic Bridge -->
    <path d="M-55 -5 H50 C65 -5, 75 10, 65 25 L45 55 C35 70, 15 70, 0 55 L-40 15 C-55 0, -65 -5, -55 -5 Z" 
          fill="url(#craftAccent)" opacity="0.9" />

    <!-- Lower Craft Sweep (The 'C' foundation arc) -->
    <path d="M-85 -50 C-115 0, -115 80, -65 125 C-15 170, 85 160, 115 105 C125 85, 110 65, 85 65 C60 65, 45 80, 20 95 C-20 115, -65 85, -65 30 C-65 -15, -50 -40, -85 -50 Z" 
          fill="url(#flowGrad2)" />

    <!-- Precision Geometric Alignment Nodes -->
    <circle cx="85" cy="-70" r="7" fill="#ffffff" />
    <circle cx="-65" cy="125" r="7" fill="#38bdf8" />
  </g>
</svg>
