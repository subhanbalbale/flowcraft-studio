<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 512" width="100%" height="100%">
  <defs>
    <linearGradient id="logoFlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="logoCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem Group (scaled 512 base) -->
  <g id="icon" transform="translate(180, 256) scale(0.95)">
    <!-- Ambient Energy Core -->
    <circle cx="0" cy="0" r="80" fill="url(#logoFlowGrad)" opacity="0.2" />

    <!-- Top Flow Ribbon (F sweep) -->
    <path d="M-85 -70 C-40 -125, 60 -125, 105 -70 C125 -45, 115 -15, 85 -15 H-30 C-45 -15, -60 -25, -70 -40 Z" 
          fill="url(#logoFlowGrad)" />
    
    <!-- Central Bridge -->
    <path d="M-55 -5 H50 C65 -5, 75 10, 65 25 L45 55 C35 70, 15 70, 0 55 L-40 15 C-55 0, -65 -5, -55 -5 Z" 
          fill="#38bdf8" opacity="0.9" />

    <!-- Lower Craft Sweep (C foundation) -->
    <path d="M-85 -50 C-115 0, -115 80, -65 125 C-15 170, 85 160, 115 105 C125 85, 110 65, 85 65 C60 65, 45 80, 20 95 C-20 115, -65 85, -65 30 C-65 -15, -50 -40, -85 -50 Z" 
          fill="url(#logoCyan)" />

    <circle cx="85" cy="-70" r="6" fill="#ffffff" />
    <circle cx="-65" cy="125" r="6" fill="#38bdf8" />
  </g>

  <!-- Right Wordmark Group -->
  <g id="wordmark" transform="translate(360, 240)">
    <!-- Primary Wordmark -->
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="900" font-size="82" letter-spacing="-2" fill="#ffffff">
      FLOW<tspan fill="#38bdf8">CRAFT</tspan>
    </text>

    <!-- Subtitle / Positioning Tagline -->
    <text x="5" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-weight="600" font-size="20" letter-spacing="6" fill="#94a3b8">
      SOFTWARE &amp; HARDWARE STUDIO
    </text>

    <!-- Subtle Accent Line -->
    <rect x="5" y="105" width="220" height="3" rx="1.5" fill="url(#logoFlowGrad)" />
  </g>
</svg>
